<!-- index.html -->

<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Luxury PG Hostel Management
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

</head>

<body>

<div class="main-container">

  <header class="hero-section">

    <div class="hero-content">

      <h1>
        PG Hostel Management
      </h1>

      <p>
        Luxury Smart Bed Booking & Rent Alert System
      </p>

    </div>

  </header>

  <section class="dashboard">

    <div class="dashboard-card">
      <h2>Floors</h2>
      <p>5</p>
    </div>

    <div class="dashboard-card">
      <h2>Rooms</h2>
      <p>20</p>
    </div>

    <div class="dashboard-card">
      <h2>Total Beds</h2>
      <p>100</p>
    </div>

    <div class="dashboard-card">
      <h2>Occupied</h2>
      <p id="occupiedBeds">0</p>
    </div>

  </section>

  <section class="booking-section">

    <h2>
      Book Bed
    </h2>

    <form id="memberForm">

      <div class="input-grid">

        <input
          type="text"
          id="name"
          placeholder="Member Name"
          required
        >

        <input
          type="text"
          id="aadhaar"
          placeholder="Aadhaar Number"
          maxlength="12"
          required
        >

        <input
          type="text"
          id="phone"
          placeholder="Phone Number"
          maxlength="10"
          required
        >

        <input
          type="number"
          id="rent"
          placeholder="Monthly Rent"
          required
        >

        <input
          type="text"
          id="roomNumber"
          placeholder="Room Number"
          readonly
        >

        <input
          type="text"
          id="bedNumber"
          placeholder="Bed Number"
          readonly
        >

        <input
          type="text"
          id="dueDate"
          placeholder="DD/MM/YYYY"
          required
        >

      </div>

      <textarea
        id="address"
        placeholder="Full Address"
        required
      ></textarea>

      <button type="submit">
        Confirm Booking
      </button>

    </form>

  </section>

  <section class="alert-section">

    <h2>
      Upcoming Payment Alerts
    </h2>

    <div id="alertsContainer"></div>

  </section>

  <section class="layout-section">

    <h2>
      Hostel Layout
    </h2>

    <div id="floorsContainer"></div>

  </section>

</div>

<script src="script.js"></script>

</body>
</html>
